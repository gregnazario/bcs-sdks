name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on new commits to same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # VALIDATION
  # =============================================================================
  
  validate:
    name: Validate Test Vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: python -m json.tool test-vectors/bcs-comprehensive.json > /dev/null

  # =============================================================================
  # SDK TESTS - All run in parallel
  # =============================================================================

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/python/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: sdks/python
      - name: Format check
        run: make format-check
        working-directory: sdks/python
      - name: Lint
        run: make lint
        working-directory: sdks/python
      - name: Test
        run: make test
        working-directory: sdks/python

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/typescript/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
        working-directory: sdks/typescript
      - name: Format check
        run: make format-check
        working-directory: sdks/typescript
      - name: Lint
        run: make lint
        working-directory: sdks/typescript
      - name: Test
        run: make test
        working-directory: sdks/typescript

  elixir:
    name: Elixir SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/elixir/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.16'
          otp-version: '26'
      - name: Install dependencies
        run: mix deps.get
        working-directory: sdks/elixir
      - name: Format check
        run: make format-check
        working-directory: sdks/elixir
      - name: Lint
        run: make lint
        working-directory: sdks/elixir
      - name: Test
        run: make test
        working-directory: sdks/elixir

  java:
    name: Java SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/java/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Format check
        run: make format-check
        working-directory: sdks/java
      - name: Lint
        run: make lint
        working-directory: sdks/java
      - name: Test
        run: make test
        working-directory: sdks/java

  go:
    name: Go SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/go/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Format check
        run: make format-check
        working-directory: sdks/go
      - name: Lint
        run: make lint
        working-directory: sdks/go
      - name: Test
        run: make test
        working-directory: sdks/go

  csharp:
    name: C# SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/csharp/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Format check
        run: make format-check
        working-directory: sdks/csharp
      - name: Lint
        run: make lint
        working-directory: sdks/csharp
      - name: Test
        run: make test
        working-directory: sdks/csharp

  rust:
    name: Rust SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/rust/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: make format-check
        working-directory: sdks/rust
      - name: Lint
        run: make lint
        working-directory: sdks/rust
      - name: Test
        run: make test
        working-directory: sdks/rust

  cpp:
    name: C++ SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/cpp/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy cmake
      - name: Format check
        run: make format-check
        working-directory: sdks/cpp
      - name: Lint
        run: make lint
        working-directory: sdks/cpp
      - name: Test
        run: make test
        working-directory: sdks/cpp

  php:
    name: PHP SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/php/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer, php-cs-fixer, phpstan
      - name: Install dependencies
        run: composer install
        working-directory: sdks/php
      - name: Format check
        run: make format-check
        working-directory: sdks/php
      - name: Lint
        run: make lint
        working-directory: sdks/php
      - name: Test
        run: make test
        working-directory: sdks/php

  kotlin:
    name: Kotlin SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/kotlin/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Format check
        run: make format-check
        working-directory: sdks/kotlin
      - name: Lint
        run: make lint
        working-directory: sdks/kotlin
      - name: Test
        run: make test
        working-directory: sdks/kotlin

  swift:
    name: Swift SDK
    runs-on: macos-latest
    if: ${{ hashFiles('sdks/swift/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Format check
        run: make format-check
        working-directory: sdks/swift
      - name: Lint
        run: make lint
        working-directory: sdks/swift
      - name: Test
        run: make test
        working-directory: sdks/swift

  ruby:
    name: Ruby SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/ruby/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: sdks/ruby
      - name: Format check
        run: make format-check
        working-directory: sdks/ruby
      - name: Lint
        run: make lint
        working-directory: sdks/ruby
      - name: Test
        run: make test
        working-directory: sdks/ruby

  c:
    name: C SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/c/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy cmake
      - name: Format check
        run: make format-check
        working-directory: sdks/c
      - name: Lint
        run: make lint
        working-directory: sdks/c
      - name: Test
        run: make test
        working-directory: sdks/c

  zig:
    name: Zig SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/zig/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.13.0'
      - name: Format check
        run: make format-check
        working-directory: sdks/zig
      - name: Test
        run: make test
        working-directory: sdks/zig

  dart:
    name: Dart SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/dart/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
        working-directory: sdks/dart
      - name: Format check
        run: make format-check
        working-directory: sdks/dart
      - name: Lint
        run: make lint
        working-directory: sdks/dart
      - name: Test
        run: make test
        working-directory: sdks/dart

  lua:
    name: Lua SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/lua/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: '5.4'
      - uses: leafo/gh-actions-luarocks@v4
      - name: Install dependencies
        run: luarocks install --only-deps bcs-dev-1.rockspec
        working-directory: sdks/lua
      - name: Format check
        run: make format-check
        working-directory: sdks/lua
      - name: Lint
        run: make lint
        working-directory: sdks/lua
      - name: Test
        run: make test
        working-directory: sdks/lua

  ocaml:
    name: OCaml SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/ocaml/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: '5.1'
      - name: Install dependencies
        run: opam install . --deps-only --with-test
        working-directory: sdks/ocaml
      - name: Format check
        run: make format-check
        working-directory: sdks/ocaml
      - name: Test
        run: make test
        working-directory: sdks/ocaml

  perl:
    name: Perl SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/perl/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'
      - name: Install dependencies
        run: cpanm --installdeps .
        working-directory: sdks/perl
      - name: Format check
        run: make format-check
        working-directory: sdks/perl
      - name: Lint
        run: make lint
        working-directory: sdks/perl
      - name: Test
        run: make test
        working-directory: sdks/perl

  groovy:
    name: Groovy SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/groovy/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Format check
        run: make format-check
        working-directory: sdks/groovy
      - name: Lint
        run: make lint
        working-directory: sdks/groovy
      - name: Test
        run: make test
        working-directory: sdks/groovy

  erlang:
    name: Erlang SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/erlang/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '26'
          rebar3-version: '3.22'
      - name: Install dependencies
        run: rebar3 get-deps
        working-directory: sdks/erlang
      - name: Format check
        run: make format-check
        working-directory: sdks/erlang
      - name: Lint
        run: make lint
        working-directory: sdks/erlang
      - name: Test
        run: make test
        working-directory: sdks/erlang

  lisp:
    name: Common Lisp SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/lisp/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SBCL
        run: sudo apt-get install -y sbcl
      - name: Test
        run: make test
        working-directory: sdks/lisp

  # =============================================================================
  # OPTIONAL SDKS
  # =============================================================================

  shell:
    name: Shell SDK
    runs-on: ubuntu-latest
    if: ${{ hashFiles('sdks/shell/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
      - name: Format check
        run: make format-check
        working-directory: sdks/shell
      - name: Lint
        run: make lint
        working-directory: sdks/shell
      - name: Test
        run: make test
        working-directory: sdks/shell

  powershell:
    name: PowerShell SDK
    runs-on: windows-latest
    if: ${{ hashFiles('sdks/powershell/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Lint
        shell: pwsh
        run: make lint
        working-directory: sdks/powershell
      - name: Test
        shell: pwsh
        run: make test
        working-directory: sdks/powershell
